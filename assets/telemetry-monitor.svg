<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .txt-primary { fill: #c9d1d9; }
    .txt-secondary { fill: #8b949e; }
    .txt-accent { fill: #e54d2e; }
    .txt-green { fill: #238636; }
    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .blink { animation: cursorBlink 1.2s infinite; }
  </style>

  <!-- Canvas Base (Solid, 0px radius, 1px border) -->
  <rect width="850" height="200" rx="2" fill="#0d1117" stroke="#2d333b" stroke-width="1" />

  <!-- Top Telemetry Header -->
  <rect x="0" y="0" width="850" height="34" rx="2" fill="#161b22" stroke="#2d333b" stroke-width="1" />
  <text x="16" y="22" class="mono txt-primary" font-size="12" font-weight="600">TELEMETRY MONITOR: sidoxsinu</text>
  <text x="320" y="22" class="mono txt-secondary" font-size="11">[SYSTEM ACTIVE]</text>
  <rect x="720" y="10" width="10" height="10" rx="0" fill="#238636" class="blink" />
  <text x="738" y="20" class="mono txt-green" font-size="11" font-weight="600">LIVE</text>

  <!-- Left Column: Core System Telemetry -->
  <g transform="translate(16, 52)" class="mono" font-size="11">
    <text y="14"><tspan class="txt-secondary">IDENTITY      :</tspan> <tspan class="txt-primary">Muhammed Sinan M (sidoxsinu)</tspan></text>
    <text y="34"><tspan class="txt-secondary">EDUCATION     :</tspan> <tspan class="txt-primary">B.Tech Computer Science and Engineering (Year 2)</tspan></text>
    <text y="54"><tspan class="txt-secondary">INSTITUTION   :</tspan> <tspan class="txt-primary">Christ College of Engineering, Irinjalakuda</tspan></text>
    <text y="74"><tspan class="txt-secondary">CURRENT ROLE  :</tspan> <tspan class="txt-primary">Software Engineering Intern at Torcue Digital</tspan></text>
    <text y="94"><tspan class="txt-secondary">CAMPUS ROLES  :</tspan> <tspan class="txt-primary">Design Lead (IEEE Kerala) | Co-CFO (IEDC CCE)</tspan></text>
    <text y="114"><tspan class="txt-secondary">SERVICE       :</tspan> <tspan class="txt-primary">NSS Volunteer Leader (240 Certified Hours)</tspan></text>
    <text y="134"><tspan class="txt-secondary">ENGAGEMENTS   :</tspan> <tspan class="txt-primary">27 Technical Hackathons and Sprints Across Kerala</tspan></text>
  </g>

  <!-- Vertical Divider -->
  <line x1="520" y1="34" x2="520" y2="200" stroke="#2d333b" stroke-width="1" />

  <!-- Right Column: Repository & Stack Telemetry -->
  <g transform="translate(536, 52)" class="mono" font-size="11">
    <text y="14" class="txt-secondary" font-weight="600">CODE DISTRIBUTION</text>

    <!-- Language 1: TypeScript -->
    <text y="34"><tspan class="txt-primary">TypeScript</tspan> <tspan class="txt-secondary">[========  ] 36.0%</tspan></text>
    
    <!-- Language 2: JavaScript -->
    <text y="54"><tspan class="txt-primary">JavaScript</tspan> <tspan class="txt-secondary">[======    ] 28.0%</tspan></text>

    <!-- Language 3: Python -->
    <text y="74"><tspan class="txt-primary">Python    </tspan> <tspan class="txt-secondary">[====      ] 18.0%</tspan></text>

    <!-- Language 4: HTML/CSS -->
    <text y="94"><tspan class="txt-primary">HTML/CSS  </tspan> <tspan class="txt-secondary">[====      ] 18.0%</tspan></text>

    <line x1="0" y1="108" x2="298" y2="108" stroke="#2d333b" stroke-width="1" />

    <text y="126"><tspan class="txt-secondary">PUBLIC REPOS  :</tspan> <tspan class="txt-accent" font-weight="700">30 Active Repositories</tspan></text>
  </g>
</svg>