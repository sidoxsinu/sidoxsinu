<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
 <defs>
 <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#080c14" />
 <stop offset="100%" stop-color="#0e1522" />
 </linearGradient>
 <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#e54d2e" />
 <stop offset="50%" stop-color="#ff5533" />
 <stop offset="100%" stop-color="#ffaa33" />
 </linearGradient>
 <filter id="neonTerm" x="-10%" y="-10%" width="120%" height="120%">
 <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
 </filter>
 </defs>

 <style>
 .code-font { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
 .txt-green { fill: #00ff88; }
 .txt-orange { fill: #ff5533; }
 .txt-amber { fill: #ffaa33; }
 .txt-blue { fill: #58a6ff; }
 .txt-muted { fill: #8b949e; }
 .txt-white { fill: #e6edf3; }
 @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
 .cursor { animation: blink 1s infinite; }
 </style>

 <!-- Terminal Window Canvas -->
 <rect width="850" height="260" rx="14" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5" filter="url(#neonTerm)" />

 <!-- Terminal Title Bar -->
 <rect width="850" height="38" rx="14" fill="#141c2c" />
 <rect y="26" width="850" height="12" fill="#141c2c" />
 <line x1="0" y1="38" x2="850" y2="38" stroke="#30363d" stroke-width="1" />

 <!-- Window Buttons with 3D Bevel -->
 <circle cx="24" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8" />
 <circle cx="44" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8" />
 <circle cx="64" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.8" />

 <!-- Terminal Title -->
 <text x="425" y="23" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="600" class="code-font">sinan@cyber-engine: ~/profile/telemetry.json (zsh)</text>

 <!-- Terminal Body Content -->
 <g transform="translate(30, 68)" class="code-font" font-size="12">
 <!-- Command Prompt -->
 <text x="0" y="0"><tspan class="txt-green">sinan@mbp</tspan><tspan class="txt-muted">:</tspan><tspan class="txt-blue">~</tspan><tspan class="txt-muted">$</tspan> <tspan class="txt-white">neofetch --theme cyber-ember-3d</tspan></text>

 <!-- Column 1: ASCII 3D Cube / Logo -->
 <g transform="translate(5, 20)" fill="#ff5533" font-size="10.5">
 <text y="0"> .--------.</text>
 <text y="14"> / / |</text>
 <text y="28"> +--------+ |</text>
 <text y="42"> | 3D | |</text>
