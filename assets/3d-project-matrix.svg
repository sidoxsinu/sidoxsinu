<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#111824" />
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182338" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f1624" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    @keyframes floatCardA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes floatCardB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }
    .anim-float-a { animation: floatCardA 5s ease-in-out infinite; }
    .anim-float-b { animation: floatCardB 6s ease-in-out infinite; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect width="850" height="230" rx="14" fill="url(#projBg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(40, 30)">
    <circle cx="6" cy="0" r="4.5" fill="#ff5533" filter="url(#glowCard)" />
    <text x="20" y="5" fill="#ffffff" font-size="15" font-weight="bold" class="sans">PROJECT TELEMETRY &amp; 3D ARCHITECTURE MATRIX</text>
    <text x="20" y="21" fill="#8b949e" font-size="10.5" class="mono">[LIVE RADAR] Active repositories, core frameworks &amp; deployment status</text>
  </g>

  <!-- CARD 1: Next-Gen AI Assistant (Outer static translate anchors X, inner group animates Y) -->
  <g transform="translate(40, 72)">
    <g class="anim-float-a">
      <rect width="180" height="132" rx="10" fill="url(#cardGrad1)" stroke="#ff5533" stroke-width="1.2" filter="url(#glowCard)" />
      <rect width="180" height="3" rx="1.5" fill="#ff5533" />
      <text x="14" y="24" fill="#ff8a65" font-size="9" font-weight="bold" class="mono">01 // AGENTIC AI</text>
      <text x="14" y="44" fill="#ffffff" font-size="13.5" font-weight="bold" class="sans">Next-Gen AI</text>
      <text x="14" y="60" fill="#8b949e" font-size="10" class="sans">Autonomous multi-agent</text>
      <text x="14" y="74" fill="#8b949e" font-size="10" class="sans">assistant system</text>
      <!-- Tag -->
      <rect x="14" y="88" width="75" height="18" rx="4" fill="#221614" stroke="#ff5533" stroke-width="0.8" />
      <text x="22" y="101" fill="#ff8a65" font-size="9" class="mono">TypeScript</text>
      <circle cx="152" cy="116" r="4" fill="#00ff88" />
      <text x="110" y="119" fill="#8b949e" font-size="9" class="mono">ACTIVE</text>
    </g>
  </g>

  <!-- CARD 2: RuralReach -->
  <g transform="translate(236, 72)">
    <g class="anim-float-b">
      <rect width="180" height="132" rx="10" fill="url(#cardGrad1)" stroke="#30363d" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect width="180" height="3" rx="1.5" fill="#ffaa33" />
      <text x="14" y="24" fill="#ffaa33" font-size="9" font-weight="bold" class="mono">02 // FULL-STACK</text>
      <text x="14" y="44" fill="#ffffff" font-size="13.5" font-weight="bold" class="sans">RuralReach</text>
      <text x="14" y="60" fill="#8b949e" font-size="10" class="sans">Gamified education app</text>
      <text x="14" y="74" fill="#8b949e" font-size="10" class="sans">virtual garden &amp; drops</text>
      <!-- Tag -->
      <rect x="14" y="88" width="125" height="18" rx="4" fill="#201c14" stroke="#ffaa33" stroke-width="0.8" />
      <text x="20" y="101" fill="#ffaa33" font-size="9" class="mono">React &#8226; Node &#8226; Mongo</text>
      <circle cx="152" cy="116" r="4" fill="#00ff88" />
      <text x="110" y="119" fill="#8b949e" font-size="9" class="mono">DEPLOYED</text>
    </g>
  </g>

  <!-- CARD 3: BusCue -->
  <g transform="translate(432, 72)">
    <g class="anim-float-a">
      <rect width="180" height="132" rx="10" fill="url(#cardGrad1)" stroke="#30363d" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect width="180" height="3" rx="1.5" fill="#ff7b5a" />
      <text x="14" y="24" fill="#ff7b5a" font-size="9" font-weight="bold" class="mono">03 // TRANSIT TECH</text>
      <text x="14" y="44" fill="#ffffff" font-size="13.5" font-weight="bold" class="sans">BusCue</text>
      <text x="14" y="60" fill="#8b949e" font-size="10" class="sans">Real-time campus transit</text>
      <text x="14" y="74" fill="#8b949e" font-size="10" class="sans">&amp; bus tracking system</text>
      <!-- Tag -->
      <rect x="14" y="88" width="100" height="18" rx="4" fill="#241816" stroke="#ff7b5a" stroke-width="0.8" />
      <text x="20" y="101" fill="#ff7b5a" font-size="9" class="mono">Live Telemetry</text>
      <circle cx="152" cy="116" r="4" fill="#ffaa33" />
      <text x="110" y="119" fill="#8b949e" font-size="9" class="mono">BETA</text>
    </g>
  </g>

  <!-- CARD 4: Kiosk-1 Campus Compass -->
  <g transform="translate(628, 72)">
    <g class="anim-float-b">
      <rect width="180" height="132" rx="10" fill="url(#cardGrad1)" stroke="#30363d" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect width="180" height="3" rx="1.5" fill="#e54d2e" />
      <text x="14" y="24" fill="#e54d2e" font-size="9" font-weight="bold" class="mono">04 // CAMPUS IOT</text>
      <text x="14" y="44" fill="#ffffff" font-size="13.5" font-weight="bold" class="sans">Campus Kiosk</text>
      <text x="14" y="60" fill="#8b949e" font-size="10" class="sans">Interactive self-service</text>
      <text x="14" y="74" fill="#8b949e" font-size="10" class="sans">campus navigation hub</text>
      <!-- Tag -->
      <rect x="14" y="88" width="100" height="18" rx="4" fill="#221414" stroke="#e54d2e" stroke-width="0.8" />
      <text x="20" y="101" fill="#e54d2e" font-size="9" class="mono">Self-Service UI</text>
      <circle cx="152" cy="116" r="4" fill="#00ff88" />
      <text x="110" y="119" fill="#8b949e" font-size="9" class="mono">LIVE</text>
    </g>
  </g>
</svg>
