<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 215" width="100%" height="100%">
 <defs>
 <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#080c14" />
 <stop offset="100%" stop-color="#0f1624" />
 </linearGradient>
 <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#3178c6" />
 <stop offset="100%" stop-color="#58a6ff" />
 </linearGradient>
 <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#f7df1e" />
 <stop offset="100%" stop-color="#ffd84d" />
 </linearGradient>
 <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#3776ab" />
 <stop offset="100%" stop-color="#00d4ff" />
 </linearGradient>
 <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#e34f26" />
 <stop offset="100%" stop-color="#ff6b4a" />
 </linearGradient>
 <filter id="glowMetric" x="-20%" y="-20%" width="140%" height="140%">
 <feGaussianBlur stdDeviation="3" result="blur" />
 <feMerge>
 <feMergeNode in="blur" />
 <feMergeNode in="SourceGraphic" />
 </feMerge>
 </filter>
 </defs>

 <style>
 .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
 .sans { font-family: 'Inter', system-ui, sans-serif; }
 </style>

 <!-- Base Card -->
 <rect width="850" height="215" rx="14" fill="url(#statBg)" stroke="#30363d" stroke-width="1.2" />

 <!-- LEFT PANEL: CORE REPOSITORY TELEMETRY -->
 <g transform="translate(35, 26)">
 <circle cx="6" cy="0" r="4.5" fill="#ff5533" filter="url(#glowMetric)" />
 <text x="18" y="4" fill="#ffffff" font-size="14" font-weight="bold" class="sans">GITHUB DEV METRICS</text>
 <text x="18" y="19" fill="#8b949e" font-size="10" class="mono">sidoxsinu &#8226; Repository Analytics</text>

 <!-- Metric 1: Public Repos -->
 <g transform="translate(0, 36)">
 <rect width="170" height="48" rx="8" fill="#141c2c" stroke="#ff5533" stroke-width="1" stroke-opacity="0.6" />
 <text x="14" y="18" fill="#8b949e" font-size="9" font-weight="bold" class="mono">PUBLIC REPOSITORIES</text>
 <text x="14" y="38" fill="#ff5533" font-size="18" font-weight="900" class="sans">40 Repos</text>
 </g>

 <!-- Metric 2: Primary Tech -->
 <g transform="translate(182, 36)">
 <rect width="170" height="48" rx="8" fill="#141c2c" stroke="#30363d" stroke-width="1" />
 <text x="14" y="18" fill="#8b949e" font-size="9" font-weight="bold" class="mono">CORE ECOSYSTEM</text>
 <text x="14" y="37" fill="#58a6ff" font-size="14" font-weight="bold" class="sans">TypeScript / AI</text>
 </g>

 <!-- Metric 3: Hackathons & Community -->
 <g transform="translate(0, 92)">
 <rect width="170" height="48" rx="8" fill="#141c2c" stroke="#30363d" stroke-width="1" />
 <text x="14" y="18" fill="#8b949e" font-size="9" font-weight="bold" class="mono">TECH HACKATHONS</text>
 <text x="14" y="38" fill="#ffaa33" font-size="18" font-weight="900" class="sans">27+ Battles</text>
 </g>

 <!-- Metric 4: Community Service -->
 <g transform="translate(182, 92)">
 <rect width="170" height="48" rx="8" fill="#141c2c" stroke="#30363d" stroke-width="1" />
 <text x="14" y="18" fill="#8b949e" font-size="9" font-weight="bold" class="mono">NSS LEAD SERVICE</text>
 <text x="14" y="38" fill="#00ff88" font-size="18" font-weight="900" class="sans">240h+ Certified</text>
 </g>

 <!-- Rating Footer Pill -->
 <g transform="translate(0, 148)">
 <rect width="352" height="26" rx="6" fill="#121824" stroke="#ff5533" stroke-width="0.8" stroke-opacity="0.7" />
 <text x="12" y="17" fill="#8b949e" font-size="9.5" font-weight="600" class="mono">DEVELOPER GRADE:</text>
 <text x="120" y="17" fill="#ff5533" font-size="10.5" font-weight="900" class="mono">A++ [POLYGLOT FULL-STACK ARCHITECT]</text>
 </g>
 </g>

 <!-- Vertical Divider -->
 <line x1="425" y1="22" x2="425" y2="195" stroke="#30363d" stroke-dasharray="3,3" stroke-width="1" />

 <!-- RIGHT PANEL: TOP LANGUAGES BREAKDOWN -->
 <g transform="translate(455, 26)">
 <circle cx="6" cy="0" r="4.5" fill="#58a6ff" filter="url(#glowMetric)" />
 <text x="18" y="4" fill="#ffffff" font-size="14" font-weight="bold" class="sans">LANGUAGE POWER INDEX</text>
 <text x="18" y="19" fill="#8b949e" font-size="10" class="mono">Code Distribution Across Active Repositories</text>

 <!-- Bar 1: TypeScript -->
 <g transform="translate(0, 36)">
 <text x="0" y="11" fill="#e6edf3" font-size="11" font-weight="600" class="sans">TypeScript</text>
 <text x="355" y="11" text-anchor="end" fill="#58a6ff" font-size="10.5" font-weight="bold" class="mono">36.0%</text>
 <rect x="0" y="16" width="355" height="7" rx="3.5" fill="#161b22" />
 <rect x="0" y="16" width="128" height="7" rx="3.5" fill="url(#tsGrad)" />
 </g>

 <!-- Bar 2: JavaScript -->
 <g transform="translate(0, 66)">
 <text x="0" y="11" fill="#e6edf3" font-size="11" font-weight="600" class="sans">JavaScript / Node.js</text>
 <text x="355" y="11" text-anchor="end" fill="#ffd84d" font-size="10.5" font-weight="bold" class="mono">28.0%</text>
 <rect x="0" y="16" width="355" height="7" rx="3.5" fill="#161b22" />
 <rect x="0" y="16" width="99" height="7" rx="3.5" fill="url(#jsGrad)" />
 </g>

 <!-- Bar 3: Python -->
 <g transform="translate(0, 96)">
 <text x="0" y="11" fill="#e6edf3" font-size="11" font-weight="600" class="sans">Python (AI &amp; Automation)</text>
 <text x="355" y="11" text-anchor="end" fill="#00d4ff" font-size="10.5" font-weight="bold" class="mono">18.0%</text>
 <rect x="0" y="16" width="355" height="7" rx="3.5" fill="#161b22" />
 <rect x="0" y="16" width="64" height="7" rx="3.5" fill="url(#pyGrad)" />
 </g>

 <!-- Bar 4: HTML5 / CSS3 / Web3D -->
 <g transform="translate(0, 126)">
 <text x="0" y="11" fill="#e6edf3" font-size="11" font-weight="600" class="sans">HTML5 / WebGL / CSS</text>
 <text x="355" y="11" text-anchor="end" fill="#ff5533" font-size="10.5" font-weight="bold" class="mono">18.0%</text>
 <rect x="0" y="16" width="355" height="7" rx="3.5" fill="#161b22" />
 <rect x="0" y="16" width="64" height="7" rx="3.5" fill="url(#htmlGrad)" />
 </g>
 </g>
</svg>
