<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#111824" />
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182338" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f1624" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    @keyframes floatCardA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes floatCardB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }
    .anim-float-a { animation: floatCardA 5s ease-in-out infinite; }
    .anim-float-b { animation: floatCardB 6s ease-in-out infinite; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect width="850" height="230" rx="14" fill="url(#projBg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(40, 30)">
    <circle cx="6" cy="0" r="4.5" fill="#ff5533" filter="url(#glowCard)" />
    <text x="20" y="5" fill="#ffffff" font-size="15" font-weight="bold" class="sans">PROJECT TELEMETRY &amp; 3D ARCHITECTURE MATRIX</text>
    <text x="20" y="21" fill="#8b949e" font-size="10.5" class="mono">[PROJECT MATRIX] Active repositories, core frameworks &amp; deployment status</text>
  </g>

  <!-- CARD 1: Next-Gen AI Assistant (Outer static translate anchors X, inner group animates Y) -->
  <g transform="translate(40, 72)">
    <g class="anim-float-a">
      <rect width="180" height="132" rx="10" fill="url(#cardGrad1)" stroke="#ff5533" stroke-width="1.2" filter="url(#glowCard)" />
      <rect width="180" height="3" rx="1.5" fill="#ff5533" />
      <text x="14" y="24" fill="#ff8a65" font-size="9" font-weight="bold" class="mono">01 // BEST TECH PROJECT</text>
      <text x="14" y="44" fill="#ffffff" font-size="13.5" font-weight="bold" class="sans">Next-Gen AI</text>
      <text x="14" y="60" fill="#8b949e" font-size="10" class="sans">Voice &amp; text terminal</text>
      <text x="14" y="74" fill="#8b949e" font-size="10" class="sans">LLaMA 3.3 + Whisper</text>
      <!-- Tag -->
      <rect x="14" y="88" width="130" height="18" rx="4" fill="#221614" stroke="#ff5533" stroke-width="0.8" />
      <text x="20" y="101" fill="#ff8a65" font-size="9" class="mono">Python &#8226; Groq &#8226; LLaMA</text>
      <circle cx="152" cy="116" r="4" fill="#00ff88" />
      <text x="110" y="119" fill="#8b949e" font-size="9" class="mono">ACTIVE</text>
    </g>
  </g>

  <!-- CARD 2: GhostOps -->
  <g transform="translate(236, 72)">
    <g class="anim-float-b">
      <rect width="180" height="132" rx="10" fill="url(#cardGrad1)" stroke="#30363d" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect width="180" height="3" rx="1.5" fill="#ffaa33" />
      <text x="14" y="24" fill="#ffaa33" font-size="9" font-weight="bold" class="mono">02 // CYBERSECURITY</text>
      <text x="14" y="44" fill="#ffffff" font-size="13.5" font-weight="bold" class="sans">GhostOps</text>
      <text x="14" y="60" fill="#8b949e" font-size="10" class="sans">Zero-trust offboarding</text>
      <text x="14" y="74" fill="#8b949e" font-size="10" class="sans">AWS IAM, GitHub &amp; SSH</text>
      <!-- Tag -->
      <rect x="14" y="88" width="145" height="18" rx="4" fill="#201c14" stroke="#ffaa33" stroke-width="0.8" />
      <text x="18" y="101" fill="#ffaa33" font-size="9" class="mono">FastAPI &#8226; Docker &#8226; React</text>
      <circle cx="152" cy="116" r="4" fill="#00ff88" />
      <text x="100" y="119" fill="#8b949e" font-size="9" class="mono">36H SPRINT</text>
    </g>
  </g>

  <!-- CARD 3: GATE Layover -->
  <g transform="translate(432, 72)">
    <g class="anim-float-a">
      <rect width="180" height="132" rx="10" fill="url(#cardGrad1)" stroke="#30363d" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect width="180" height="3" rx="1.5" fill="#ff7b5a" />
      <text x="14" y="24" fill="#ff7b5a" font-size="9" font-weight="bold" class="mono">03 // TRAVEL TECH</text>
      <text x="14" y="44" fill="#ffffff" font-size="13.5" font-weight="bold" class="sans">GATE Layover</text>
      <text x="14" y="60" fill="#8b949e" font-size="10" class="sans">Location missions, XP</text>
      <text x="14" y="74" fill="#8b949e" font-size="10" class="sans">&amp; travel memory passport</text>
      <!-- Tag -->
      <rect x="14" y="88" width="138" height="18" rx="4" fill="#241816" stroke="#ff7b5a" stroke-width="0.8" />
      <text x="18" y="101" fill="#ff7b5a" font-size="9" class="mono">Next.js &#8226; Supabase &#8226; Groq</text>
      <circle cx="152" cy="116" r="4" fill="#00ff88" />
      <text x="100" y="119" fill="#8b949e" font-size="9" class="mono">DEPLOYED</text>
    </g>
  </g>

  <!-- CARD 4: Pylon Smart Finder -->
  <g transform="translate(628, 72)">
    <g class="anim-float-b">
      <rect width="180" height="132" rx="10" fill="url(#cardGrad1)" stroke="#30363d" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect width="180" height="3" rx="1.5" fill="#e54d2e" />
      <text x="14" y="24" fill="#e54d2e" font-size="9" font-weight="bold" class="mono">04 // 2ND PRIZE WEBATHON</text>
      <text x="14" y="44" fill="#ffffff" font-size="13.5" font-weight="bold" class="sans">Pylon Finder</text>
      <text x="14" y="60" fill="#8b949e" font-size="10" class="sans">Smart scholarship match</text>
      <text x="14" y="74" fill="#8b949e" font-size="10" class="sans">custom filter algorithm</text>
      <!-- Tag -->
      <rect x="14" y="88" width="125" height="18" rx="4" fill="#221414" stroke="#e54d2e" stroke-width="0.8" />
      <text x="20" y="101" fill="#e54d2e" font-size="9" class="mono">Vanilla HTML &#8226; CSS &#8226; JS</text>
      <circle cx="152" cy="116" r="4" fill="#00ff88" />
      <text x="100" y="119" fill="#8b949e" font-size="9" class="mono">PRODUCTION</text>
    </g>
  </g>
</svg>
