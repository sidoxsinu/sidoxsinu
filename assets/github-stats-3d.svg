<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f1624" />
    </linearGradient>
    <linearGradient id="flameFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e54d2e" />
      <stop offset="50%" stop-color="#ff5533" />
      <stop offset="100%" stop-color="#ffaa33" />
    </linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7df1e" />
      <stop offset="100%" stop-color="#ffd84d" />
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3776ab" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e34f26" />
      <stop offset="100%" stop-color="#ff6b4a" />
    </linearGradient>
    <filter id="glowMetric" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', system-ui, sans-serif; }
    @keyframes pulseScore { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .grade-badge { animation: pulseScore 3s ease-in-out infinite; transform-origin: 340px 105px; }
  </style>

  <!-- Base Card -->
  <rect width="850" height="220" rx="16" fill="url(#statBg)" stroke="#30363d" stroke-width="1.5" />

  <!-- LEFT PANEL: CORE REPOSITORY TELEMETRY -->
  <g transform="translate(35, 30)">
    <circle cx="6" cy="0" r="5" fill="#ff5533" filter="url(#glowMetric)" />
    <text x="20" y="5" fill="#ffffff" font-size="15" font-weight="bold" class="sans">GITHUB DEV METRICS</text>
    <text x="20" y="20" fill="#8b949e" font-size="10.5" class="mono">sidoxsinu &#8226; Live Repository Analytics</text>

    <!-- Metric 1: Public Repos -->
    <g transform="translate(0, 42)">
      <rect width="135" height="52" rx="8" fill="#141c2c" stroke="#ff5533" stroke-width="1" stroke-opacity="0.6" />
      <text x="14" y="20" fill="#8b949e" font-size="9" font-weight="bold" class="mono">PUBLIC REPOS</text>
      <text x="14" y="42" fill="#ff5533" font-size="20" font-weight="900" class="sans">30+</text>
    </g>

    <!-- Metric 2: Primary Tech -->
    <g transform="translate(145, 42)">
      <rect width="135" height="52" rx="8" fill="#141c2c" stroke="#30363d" stroke-width="1" />
      <text x="14" y="20" fill="#8b949e" font-size="9" font-weight="bold" class="mono">CORE FOCUS</text>
      <text x="14" y="40" fill="#58a6ff" font-size="14.5" font-weight="bold" class="sans">TypeScript / AI</text>
    </g>

    <!-- Metric 3: Hackathons & Community -->
    <g transform="translate(0, 102)">
      <rect width="135" height="52" rx="8" fill="#141c2c" stroke="#30363d" stroke-width="1" />
      <text x="14" y="20" fill="#8b949e" font-size="9" font-weight="bold" class="mono">HACKATHONS</text>
      <text x="14" y="42" fill="#ffaa33" font-size="20" font-weight="900" class="sans">27+</text>
    </g>

    <!-- Metric 4: Community Service -->
    <g transform="translate(145, 102)">
      <rect width="135" height="52" rx="8" fill="#141c2c" stroke="#30363d" stroke-width="1" />
      <text x="14" y="20" fill="#8b949e" font-size="9" font-weight="bold" class="mono">NSS LEAD HOURS</text>
      <text x="14" y="42" fill="#00ff88" font-size="20" font-weight="900" class="sans">240h+</text>
    </g>

    <!-- Grade Seal -->
    <g class="grade-badge" transform="translate(295, 45)">
      <circle cx="45" cy="55" r="34" fill="#161f30" stroke="#ff5533" stroke-width="2" filter="url(#glowMetric)" />
      <text x="45" y="50" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" class="mono">RATING</text>
      <text x="45" y="72" text-anchor="middle" fill="#ff5533" font-size="22" font-weight="900" class="sans">A++</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="420" y1="25" x2="420" y2="195" stroke="#30363d" stroke-dasharray="3,3" stroke-width="1" />

  <!-- RIGHT PANEL: TOP LANGUAGES BREAKDOWN -->
  <g transform="translate(450, 30)">
    <circle cx="6" cy="0" r="5" fill="#58a6ff" filter="url(#glowMetric)" />
    <text x="20" y="5" fill="#ffffff" font-size="15" font-weight="bold" class="sans">LANGUAGE POWER INDEX</text>
    <text x="20" y="20" fill="#8b949e" font-size="10.5" class="mono">Code Distribution Across Ecosystems</text>

    <!-- Bar 1: TypeScript -->
    <g transform="translate(0, 38)">
      <text x="0" y="11" fill="#e6edf3" font-size="11" font-weight="600" class="sans">TypeScript</text>
      <text x="340" y="11" text-anchor="end" fill="#58a6ff" font-size="11" font-weight="bold" class="mono">36.0%</text>
      <rect x="0" y="16" width="340" height="8" rx="4" fill="#161b22" />
      <rect x="0" y="16" width="122" height="8" rx="4" fill="url(#tsGrad)" />
    </g>

    <!-- Bar 2: JavaScript -->
    <g transform="translate(0, 68)">
      <text x="0" y="11" fill="#e6edf3" font-size="11" font-weight="600" class="sans">JavaScript / Node</text>
      <text x="340" y="11" text-anchor="end" fill="#ffd84d" font-size="11" font-weight="bold" class="mono">28.0%</text>
      <rect x="0" y="16" width="340" height="8" rx="4" fill="#161b22" />
      <rect x="0" y="16" width="95" height="8" rx="4" fill="url(#jsGrad)" />
    </g>

    <!-- Bar 3: Python -->
    <g transform="translate(0, 98)">
      <text x="0" y="11" fill="#e6edf3" font-size="11" font-weight="600" class="sans">Python (AI &amp; Automation)</text>
      <text x="340" y="11" text-anchor="end" fill="#00d4ff" font-size="11" font-weight="bold" class="mono">18.0%</text>
      <rect x="0" y="16" width="340" height="8" rx="4" fill="#161b22" />
      <rect x="0" y="16" width="61" height="8" rx="4" fill="url(#pyGrad)" />
    </g>

    <!-- Bar 4: HTML5 / CSS3 / Web3D -->
    <g transform="translate(0, 128)">
      <text x="0" y="11" fill="#e6edf3" font-size="11" font-weight="600" class="sans">HTML5 / WebGL / CSS</text>
      <text x="340" y="11" text-anchor="end" fill="#ff5533" font-size="11" font-weight="bold" class="mono">18.0%</text>
      <rect x="0" y="16" width="340" height="8" rx="4" fill="#161b22" />
      <rect x="0" y="16" width="61" height="8" rx="4" fill="url(#htmlGrad)" />
    </g>
  </g>
</svg>