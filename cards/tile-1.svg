<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 145" width="100%" height="100%">
  <defs>
    <linearGradient id="tileBg_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216" />
      <stop offset="100%" stop-color="#17171d" />
    </linearGradient>
  </defs>
  <style>
    
        @font-face {
          font-family: 'General Sans';
          font-style: normal;
          font-weight: 700;
          src: url('data:font/woff;charset=utf-8;base64,') format('woff');
        }

        @font-face {
          font-family: 'General Sans';
          font-style: normal;
          font-weight: 500;
          src: url('data:font/woff;charset=utf-8;base64,') format('woff');
        }

        @font-face {
          font-family: 'JetBrains Mono';
          font-style: normal;
          font-weight: 500;
          src: url('data:font/woff;charset=utf-8;base64,') format('woff');
        }
    
      
        .card-container {
          opacity: 0;
          animation: cardFadeIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          animation-delay: 0.35s;
        }
        @keyframes cardFadeIn {
          0% { opacity: 0; transform: translateY(8px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseRing {
          0%, 100% { stroke-opacity: 0.3; transform: scale(1); }
          50% { stroke-opacity: 0.85; transform: scale(1.02); }
        }
        @keyframes pulseDot {
          0%, 100% { opacity: 0.4; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.15); }
        }
        .pulse-dot {
          animation: pulseDot 2.2s ease-in-out infinite;
          transform-origin: center;
        }
        .pulse-ring {
          animation: pulseRing 3.5s ease-in-out infinite;
          transform-origin: center;
        }
        
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
        }
        .card-container {
          opacity: 1 !important;
        }
        .pulse-dot, .pulse-ring {
          animation: none !important;
          opacity: 1 !important;
        }
      }
      .font-sans { font-family: 'General Sans', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    
  </style>

  <g class="card-container">
    <!-- Tile Background -->
    <rect width="270" height="145" rx="14" fill="url(#tileBg_1)" stroke="#26262e" stroke-width="1.2" />
    <!-- Top Corner Accent Strip -->
    <path d="M 0 14 L 0 0 L 70 0" fill="none" stroke="#e54d2e" stroke-width="2.5" stroke-linecap="round" />

    <g transform="translate(18, 24)">
      <!-- Eyebrow -->
      <text x="0" y="0" fill="#e54d2e" font-size="9" font-weight="700" class="font-mono" letter-spacing="1">EXPERIENCE // 6 MONTHS</text>
      <!-- Title -->
      <text x="0" y="24" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Software Intern</text>
      <!-- Subtitle -->
      <text x="0" y="42" fill="#e54d2e" font-size="12" font-weight="600" class="font-sans">Torcue Digital</text>
      <!-- Description -->
      <text x="0" y="62" fill="#888891" font-size="10.5" font-weight="500" class="font-sans">Full-stack web, iOS &amp; AI tickets</text>

      <!-- Bottom Link Indicator -->
      <g transform="translate(0, 94)">
        <rect width="234" height="20" rx="4" fill="#15151c" stroke="#26262e" stroke-width="0.8" />
        <text x="10" y="14" fill="#d4d4d8" font-size="9.5" font-weight="500" class="font-mono">Client Systems under NDA</text>
        <text x="218" y="14" fill="#e54d2e" font-size="11" font-weight="700" class="font-sans">→</text>
      </g>
    </g>
  </g>
</svg>