name: Refresh GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fonttools brotli requests pillow

      - name: Refresh contributions data and generate SVG cards
        run: |
          python3 generate_cards.py --refresh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh profile contribution data and SVG cards [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi
