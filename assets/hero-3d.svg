<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0b1019" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>

    <!-- Glowing Cyber Grid Gradient -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5533" stop-opacity="0" />
      <stop offset="60%" stop-color="#ff5533" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff5533" stop-opacity="0.7" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Text 3D Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ffd2c4" />
      <stop offset="70%" stop-color="#ff5533" />
      <stop offset="100%" stop-color="#b82a0d" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a65" />
      <stop offset="50%" stop-color="#ff5533" />
      <stop offset="100%" stop-color="#e54d2e" />
    </linearGradient>

    <!-- 3D Cube Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a65" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff5533" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b82a0d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5a1205" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e54d2e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8a1e09" stop-opacity="0.85" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182030" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f1420" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-3deg); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.04); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes scan {
      0% { transform: translateY(-20px); opacity: 0; }
      30% { opacity: 0.7; }
      70% { opacity: 0.7; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    .float-1 { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
    .float-2 { animation: floatReverse 7s ease-in-out infinite; transform-origin: center; }
    .pulse-glow { animation: pulseAura 4s ease-in-out infinite; transform-origin: center; }
    .scanning-line { animation: scan 5s linear infinite; }
    .mono-font { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans-font { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="850" height="340" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- 3D Perspective Grid Horizon Floor -->
  <g opacity="0.65">
    <!-- Perspective lines receding to vanishing point (425, 110) -->
    <path d="M 425 110 L 0 340" stroke="url(#gridGrad)" stroke-width="1.2" />
    <path d="M 425 110 L 100 340" stroke="url(#gridGrad)" stroke-width="1.2" />
    <path d="M 425 110 L 220 340" stroke="url(#gridGrad)" stroke-width="1.2" />
    <path d="M 425 110 L 330 340" stroke="url(#gridGrad)" stroke-width="1.2" />
    <path d="M 425 110 L 425 340" stroke="url(#gridGrad)" stroke-width="1.4" />
    <path d="M 425 110 L 520 340" stroke="url(#gridGrad)" stroke-width="1.2" />
    <path d="M 425 110 L 630 340" stroke="url(#gridGrad)" stroke-width="1.2" />
    <path d="M 425 110 L 750 340" stroke="url(#gridGrad)" stroke-width="1.2" />
    <path d="M 425 110 L 850 340" stroke="url(#gridGrad)" stroke-width="1.2" />

    <!-- Isometric horizontal rungs -->
    <line x1="395" y1="130" x2="455" y2="130" stroke="#ff5533" stroke-opacity="0.15" stroke-width="1" />
    <line x1="365" y1="155" x2="485" y2="155" stroke="#ff5533" stroke-opacity="0.22" stroke-width="1" />
    <line x1="320" y1="185" x2="530" y2="185" stroke="#ff5533" stroke-opacity="0.30" stroke-width="1.2" />
    <line x1="260" y1="225" x2="590" y2="225" stroke="#ff5533" stroke-opacity="0.40" stroke-width="1.4" />
    <line x1="170" y1="275" x2="680" y2="275" stroke="#ff5533" stroke-opacity="0.55" stroke-width="1.6" />
    <line x1="50"  y1="335" x2="800" y2="335" stroke="#ff5533" stroke-opacity="0.75" stroke-width="1.8" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="425" cy="110" r="140" fill="#ff5533" opacity="0.15" filter="url(#neonGlow)" class="pulse-glow" />
  <circle cx="740" cy="90" r="90" fill="#ff8a65" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="110" cy="190" r="75" fill="#e54d2e" opacity="0.1" filter="url(#neonGlow)" />

  <!-- Animated Scanline -->
  <line x1="0" y1="0" x2="850" y2="0" stroke="#ff5533" stroke-width="1.5" opacity="0.4" class="scanning-line" />

  <!-- Floating 3D Isometric Elements (Left side) -->
  <g class="float-1" transform="translate(68, 62)">
    <!-- 3D Cube with depth & glow -->
    <!-- Top Face -->
    <polygon points="40,10 75,28 40,46 5,28" fill="url(#cubeTop)" stroke="#ffa07a" stroke-width="1.2" filter="url(#dropShadow)" />
    <!-- Left Face -->
    <polygon points="5,28 40,46 40,86 5,68" fill="url(#cubeLeft)" stroke="#ff5533" stroke-width="1.2" />
    <!-- Right Face -->
    <polygon points="40,46 75,28 75,68 40,86" fill="url(#cubeRight)" stroke="#ff5533" stroke-width="1.2" />
    <!-- Glowing core wireframe -->
    <circle cx="40" cy="46" r="3" fill="#ffffff" filter="url(#neonGlow)" />
    <!-- Floating mini node -->
    <circle cx="82" cy="14" r="2.5" fill="#ff8a65" filter="url(#neonGlow)" />
    <line x1="75" y1="28" x2="82" y2="14" stroke="#ff8a65" stroke-dasharray="2,2" stroke-width="1" opacity="0.7" />
  </g>

  <!-- Floating 3D Isometric Elements (Right side) -->
  <g class="float-2" transform="translate(710, 140)">
    <!-- 3D Diamond / Octahedron Facets -->
    <polygon points="45,0 80,35 45,70 10,35" fill="url(#cubeTop)" stroke="#ffa07a" stroke-width="1.2" filter="url(#dropShadow)" />
    <polygon points="45,0 45,70 80,35" fill="url(#cubeRight)" opacity="0.9" />
    <polygon points="45,0 10,35 45,70" fill="url(#cubeLeft)" opacity="0.85" />
    <!-- Inner glowing diamond core -->
    <polygon points="45,15 65,35 45,55 25,35" fill="#ffffff" opacity="0.8" filter="url(#neonGlow)" />
    <!-- Orbital Ring with 3D tilt -->
    <ellipse cx="45" cy="35" rx="55" ry="18" fill="none" stroke="#ff8a65" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.75" transform="rotate(-20 45 35)" />
  </g>

  <!-- Small floating decorative cubes -->
  <g class="float-2" transform="translate(130, 220) scale(0.6)">
    <polygon points="30,8 55,20 30,32 5,20" fill="url(#cubeTop)" stroke="#ffa07a" stroke-width="1" />
    <polygon points="5,20 30,32 30,60 5,48" fill="url(#cubeLeft)" stroke="#ff5533" stroke-width="1" />
    <polygon points="30,32 55,20 55,48 30,60" fill="url(#cubeRight)" stroke="#ff5533" stroke-width="1" />
  </g>
  <g class="float-1" transform="translate(680, 50) scale(0.55)">
    <polygon points="30,8 55,20 30,32 5,20" fill="url(#cubeTop)" stroke="#ffa07a" stroke-width="1" />
    <polygon points="5,20 30,32 30,60 5,48" fill="url(#cubeLeft)" stroke="#ff5533" stroke-width="1" />
    <polygon points="30,32 55,20 55,48 30,60" fill="url(#cubeRight)" stroke="#ff5533" stroke-width="1" />
  </g>

  <!-- Top HUD Bar -->
  <g transform="translate(40, 28)">
    <!-- Terminal status pill -->
    <rect width="180" height="26" rx="13" fill="#111722" stroke="#ff5533" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="13" r="4.5" fill="#00ff88" filter="url(#neonGlow)" />
    <text x="28" y="17" fill="#c9d1d9" font-size="11" font-weight="600" class="mono-font" letter-spacing="1">SYSTEM: ONLINE</text>

    <!-- Coordinates / Mode -->
    <rect x="590" y="0" width="180" height="26" rx="13" fill="#111722" stroke="#ff5533" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="606" cy="13" r="4.5" fill="#ff5533" filter="url(#neonGlow)" />
    <text x="618" y="17" fill="#c9d1d9" font-size="11" font-weight="600" class="mono-font" letter-spacing="1">MODE: 3D CYBER HUD</text>
  </g>

  <!-- CENTER 3D HERO BRANDING -->
  <g transform="translate(425, 125)" text-anchor="middle">
    <!-- Subtitle badge -->
    <rect x="-170" y="-38" width="340" height="26" rx="13" fill="#161e2e" stroke="#ff5533" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="0" y="-21" fill="#ff8a65" font-size="11.5" font-weight="700" class="mono-font" letter-spacing="2">⚡ FULL-STACK ARCHITECT • AGENTIC AI</text>

    <!-- 3D LAYERED TITLE: MUHAMMED SINAN M -->
    <!-- Layer 4: Deep Cast Shadow -->
    <text x="0" y="44" fill="#03060a" font-size="44" font-weight="900" class="sans-font" letter-spacing="4">MUHAMMED SINAN M</text>
    <!-- Layer 3: Extrusion Base -->
    <text x="0" y="42" fill="#5c1205" font-size="44" font-weight="900" class="sans-font" letter-spacing="4">MUHAMMED SINAN M</text>
    <!-- Layer 2: Extrusion Mid -->
    <text x="0" y="40" fill="#b82a0d" font-size="44" font-weight="900" class="sans-font" letter-spacing="4">MUHAMMED SINAN M</text>
    <!-- Layer 1: Front Face with Neon Glow -->
    <text x="0" y="38" fill="url(#textGrad)" font-size="44" font-weight="900" class="sans-font" letter-spacing="4" filter="url(#neonGlow)">MUHAMMED SINAN M</text>

    <!-- Tagline -->
    <text x="0" y="72" fill="#e6edf3" font-size="14.5" font-weight="500" class="sans-font" opacity="0.95">
      Crafting Next-Gen Web Platforms, 3D Experiences &amp; Intelligent Agentic Systems
    </text>
    <text x="0" y="93" fill="#8b949e" font-size="12" font-weight="400" class="mono-font">
      @sidoxsinu &#8226; Irinjalakuda, Kerala &#8226; Christ College of Engineering
    </text>
  </g>

  <!-- Bottom Telemetry Badges (Floating 3D pill cards) -->
  <g transform="translate(65, 275)">
    <!-- Pill 1: Internship -->
    <g transform="translate(0, 0)">
      <rect width="168" height="36" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#dropShadow)" />
      <rect width="4" height="36" rx="2" fill="#ff5533" />
      <text x="14" y="15" fill="#8b949e" font-size="9" font-weight="600" class="mono-font">SOFTWARE INTERN</text>
      <text x="14" y="29" fill="#ffffff" font-size="11.5" font-weight="700" class="sans-font">Torcue Digital</text>
    </g>

    <!-- Pill 2: Leadership -->
    <g transform="translate(184, 0)">
      <rect width="168" height="36" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#dropShadow)" />
      <rect width="4" height="36" rx="2" fill="#ff8a65" />
      <text x="14" y="15" fill="#8b949e" font-size="9" font-weight="600" class="mono-font">DESIGN LEAD</text>
      <text x="14" y="29" fill="#ffffff" font-size="11.5" font-weight="700" class="sans-font">IEEE Kerala Chapter</text>
    </g>

    <!-- Pill 3: Finance / Leadership -->
    <g transform="translate(368, 0)">
      <rect width="168" height="36" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#dropShadow)" />
      <rect width="4" height="36" rx="2" fill="#ffa07a" />
      <text x="14" y="15" fill="#8b949e" font-size="9" font-weight="600" class="mono-font">CAMPUS LEAD</text>
      <text x="14" y="29" fill="#ffffff" font-size="11.5" font-weight="700" class="sans-font">Co-CFO @ IEDC CCE</text>
    </g>

    <!-- Pill 4: Open Source & Projects -->
    <g transform="translate(552, 0)">
      <rect width="168" height="36" rx="8" fill="url(#cardGrad)" stroke="#ff5533" stroke-width="1.2" stroke-opacity="0.8" filter="url(#dropShadow)" />
      <rect width="4" height="36" rx="2" fill="#00ff88" />
      <text x="14" y="15" fill="#8b949e" font-size="9" font-weight="600" class="mono-font">OPEN SOURCE</text>
      <text x="14" y="29" fill="#00ff88" font-size="11.5" font-weight="700" class="sans-font">30+ Repositories</text>
    </g>
  </g>
</svg>
