<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
 <defs>
 <!-- Background Gradient -->
 <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#06090e" />
 <stop offset="50%" stop-color="#0b1019" />
 <stop offset="100%" stop-color="#121824" />
 </linearGradient>

 <!-- Glowing Cyber Grid Gradient -->
 <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#ff5533" stop-opacity="0" />
 <stop offset="60%" stop-color="#ff5533" stop-opacity="0.2" />
 <stop offset="100%" stop-color="#ff5533" stop-opacity="0.6" />
 </linearGradient>

 <!-- Neon Glow Filter -->
 <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
 <feGaussianBlur stdDeviation="5" result="blur" />
 <feMerge>
 <feMergeNode in="blur" />
 <feMergeNode in="SourceGraphic" />
 </feMerge>
 </filter>

 <!-- 3D Shadow Filter -->
 <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
 </filter>

 <!-- Crisp 3D Text Gradient (No Ghosting) -->
 <linearGradient id="heroTitleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#ffffff" />
 <stop offset="50%" stop-color="#ffd5cc" />
 <stop offset="85%" stop-color="#ff5533" />
 <stop offset="100%" stop-color="#cc3311" />
 </linearGradient>

 <!-- 3D Cube Gradients -->
 <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#ff8a65" stop-opacity="0.9" />
 <stop offset="100%" stop-color="#ff5533" stop-opacity="0.7" />
 </linearGradient>
 <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#b82a0d" stop-opacity="0.9" />
 <stop offset="100%" stop-color="#5a1205" stop-opacity="0.95" />
 </linearGradient>
 <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#e54d2e" stop-opacity="0.85" />
 <stop offset="100%" stop-color="#8a1e09" stop-opacity="0.9" />
 </linearGradient>

 <!-- Card Background Gradient -->
 <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#161f30" stop-opacity="0.95" />
 <stop offset="100%" stop-color="#0d131f" stop-opacity="0.95" />
 </linearGradient>
 </defs>

 <style>
 @keyframes floatSlow {
 0%, 100% { transform: translateY(0px) rotate(0deg); }
 50% { transform: translateY(-10px) rotate(2deg); }
 }
 @keyframes floatReverse {
 0%, 100% { transform: translateY(0px) rotate(0deg); }
 50% { transform: translateY(8px) rotate(-3deg); }
 }
 @keyframes pulseAura {
 0%, 100% { opacity: 0.35; transform: scale(1); }
 50% { opacity: 0.7; transform: scale(1.05); }
 }
 @keyframes scan {
 0% { transform: translateY(-10px); opacity: 0; }
 20% { opacity: 0.6; }
 80% { opacity: 0.6; }
 100% { transform: translateY(320px); opacity: 0; }
 }
 .float-1 { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
 .float-2 { animation: floatReverse 7s ease-in-out infinite; transform-origin: center; }
 .pulse-glow { animation: pulseAura 4s ease-in-out infinite; transform-origin: center; }
 .scanning-line { animation: scan 6s linear infinite; }
 .mono-font { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
 .sans-font { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
 .hero-title {
 font-family: 'Inter', system-ui, -apple-system, sans-serif;
 font-size: 42px;
 font-weight: 900;
 letter-spacing: 3px;
 fill: url(#heroTitleGrad);
 filter: drop-shadow(0 4px 12px rgba(255, 85, 51, 0.5)) drop-shadow(0 8px 24px rgba(0, 0, 0, 0.9));
 }
 </style>

 <!-- Base Canvas -->
 <rect width="850" height="320" rx="14" fill="url(#heroBg)" stroke="#30363d" stroke-width="1.2" />

 <!-- 3D Perspective Grid Horizon Floor -->
 <g opacity="0.65">
 <path d="M 425 90 L 0 320" stroke="url(#gridGrad)" stroke-width="1.2" />
 <path d="M 425 90 L 110 320" stroke="url(#gridGrad)" stroke-width="1.2" />
 <path d="M 425 90 L 230 320" stroke="url(#gridGrad)" stroke-width="1.2" />
 <path d="M 425 90 L 335 320" stroke="url(#gridGrad)" stroke-width="1.2" />
 <path d="M 425 90 L 425 320" stroke="url(#gridGrad)" stroke-width="1.4" />
 <path d="M 425 90 L 515 320" stroke="url(#gridGrad)" stroke-width="1.2" />
 <path d="M 425 90 L 620 320" stroke="url(#gridGrad)" stroke-width="1.2" />
 <path d="M 425 90 L 740 320" stroke="url(#gridGrad)" stroke-width="1.2" />
 <path d="M 425 90 L 850 320" stroke="url(#gridGrad)" stroke-width="1.2" />

 <line x1="390" y1="110" x2="460" y2="110" stroke="#ff5533" stroke-opacity="0.15" stroke-width="1" />
 <line x1="350" y1="135" x2="500" y2="135" stroke="#ff5533" stroke-opacity="0.22" stroke-width="1" />
 <line x1="300" y1="170" x2="550" y2="170" stroke="#ff5533" stroke-opacity="0.30" stroke-width="1.2" />
 <line x1="230" y1="215" x2="620" y2="215" stroke="#ff5533" stroke-opacity="0.40" stroke-width="1.4" />
 <line x1="140" y1="265" x2="710" y2="265" stroke="#ff5533" stroke-opacity="0.55" stroke-width="1.6" />
 <line x1="30" y1="315" x2="820" y2="315" stroke="#ff5533" stroke-opacity="0.75" stroke-width="1.8" />
 </g>

 <!-- Ambient Light Orbs -->
 <circle cx="425" cy="90" r="130" fill="#ff5533" opacity="0.14" filter="url(#neonGlow)" class="pulse-glow" />
 <circle cx="730" cy="80" r="80" fill="#ff8a65" opacity="0.1" filter="url(#neonGlow)" />
 <circle cx="120" cy="160" r="70" fill="#e54d2e" opacity="0.08" filter="url(#neonGlow)" />

 <!-- Animated Scanline -->
 <line x1="0" y1="0" x2="850" y2="0" stroke="#ff5533" stroke-width="1.5" opacity="0.35" class="scanning-line" />

 <!-- Floating 3D Isometric Elements (Left) -->
 <g class="float-1" transform="translate(65, 50)">
 <polygon points="36,8 68,24 36,40 4,24" fill="url(#cubeTop)" stroke="#ffa07a" stroke-width="1.2" filter="url(#shadow3D)" />
 <polygon points="4,24 36,40 36,75 4,59" fill="url(#cubeLeft)" stroke="#ff5533" stroke-width="1.2" />
 <polygon points="36,40 68,24 68,59 36,75" fill="url(#cubeRight)" stroke="#ff5533" stroke-width="1.2" />
 <circle cx="36" cy="40" r="3" fill="#ffffff" filter="url(#neonGlow)" />
 </g>

 <!-- Floating 3D Octahedron / Diamond (Right) -->
 <g class="float-2" transform="translate(720, 110)">
 <polygon points="40,0 72,32 40,64 8,32" fill="url(#cubeTop)" stroke="#ffa07a" stroke-width="1.2" filter="url(#shadow3D)" />
 <polygon points="40,0 40,64 72,32" fill="url(#cubeRight)" opacity="0.9" />
 <polygon points="40,0 8,32 40,64" fill="url(#cubeLeft)" opacity="0.85" />
 <polygon points="40,14 58,32 40,50 22,32" fill="#ffffff" opacity="0.8" filter="url(#neonGlow)" />
 <ellipse cx="40" cy="32" rx="50" ry="16" fill="none" stroke="#ff8a65" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75" transform="rotate(-20 40 32)" />
 </g>

 <!-- Top HUD Bar -->
 <g transform="translate(40, 24)">
 <rect width="170" height="24" rx="12" fill="#101724" stroke="#ff5533" stroke-width="0.9" stroke-opacity="0.6" />
 <circle cx="14" cy="12" r="4" fill="#00ff88" filter="url(#neonGlow)" />
 <text x="26" y="16" fill="#c9d1d9" font-size="10" font-weight="600" class="mono-font" letter-spacing="1">SYSTEM: ONLINE</text>

 <rect x="600" y="0" width="170" height="24" rx="12" fill="#101724" stroke="#ff5533" stroke-width="0.9" stroke-opacity="0.6" />
 <circle cx="614" cy="12" r="4" fill="#ff5533" filter="url(#neonGlow)" />
 <text x="626" y="16" fill="#c9d1d9" font-size="10" font-weight="600" class="mono-font" letter-spacing="1">MODE: 3D CYBER HUD</text>
 </g>

 <!-- CENTER BRANDING & 3D TITLE (Single crisp text, NO ghosting!) -->
 <g transform="translate(425, 120)" text-anchor="middle">
 <!-- Subtitle pill badge -->
 <rect x="-160" y="-40" width="320" height="24" rx="12" fill="#162030" stroke="#ff5533" stroke-width="1" stroke-opacity="0.8" />
 <text x="0" y="-24" fill="#ff8a65" font-size="10.5" font-weight="700" class="mono-font" letter-spacing="2"> FULL-STACK &#8226; AGENTIC AI &#8226; 3D</text>

 <!-- Crisp Hero Title with pure SVG drop-shadow filter -->
 <text x="0" y="32" class="hero-title">MUHAMMED SINAN M</text>

 <!-- Tagline (High Contrast White) -->
 <text x="0" y="65" fill="#f0f6fc" font-size="13.5" font-weight="600" class="sans-font" letter-spacing="0.3">
 Crafting Next-Gen Web Platforms, 3D Experiences &amp; Intelligent Agentic Systems
 </text>

 <!-- Details Badge -->
 <rect x="-210" y="80" width="420" height="22" rx="11" fill="#0d1420" stroke="#30363d" stroke-width="0.9" />
 <text x="0" y="95" fill="#8b949e" font-size="11" font-weight="500" class="mono-font">
 @sidoxsinu &#8226; Irinjalakuda, Kerala &#8226; Christ College of Engineering
 </text>
 </g>

 <!-- Bottom Telemetry Badges (4 Clean Floating 3D Cards) -->
 <g transform="translate(60, 260)">
 <!-- Pill 1: Internship -->
 <g transform="translate(0, 0)">
 <rect width="170" height="36" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#shadow3D)" />
 <rect width="4" height="36" rx="2" fill="#ff5533" />
 <text x="14" y="14" fill="#8b949e" font-size="8.5" font-weight="600" class="mono-font">SOFTWARE INTERN</text>
 <text x="14" y="28" fill="#ffffff" font-size="11.5" font-weight="700" class="sans-font">Torcue Digital</text>
 </g>

 <!-- Pill 2: IEEE Leadership -->
 <g transform="translate(186, 0)">
 <rect width="170" height="36" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#shadow3D)" />
 <rect width="4" height="36" rx="2" fill="#ff8a65" />
 <text x="14" y="14" fill="#8b949e" font-size="8.5" font-weight="600" class="mono-font">DESIGN LEAD</text>
 <text x="14" y="28" fill="#ffffff" font-size="11.5" font-weight="700" class="sans-font">IEEE Kerala Chapter</text>
 </g>

 <!-- Pill 3: IEDC Leadership -->
 <g transform="translate(372, 0)">
 <rect width="170" height="36" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#shadow3D)" />
 <rect width="4" height="36" rx="2" fill="#ffaa33" />
 <text x="14" y="14" fill="#8b949e" font-size="8.5" font-weight="600" class="mono-font">CAMPUS LEAD</text>
 <text x="14" y="28" fill="#ffffff" font-size="11.5" font-weight="700" class="sans-font">Co-CFO @ IEDC CCE</text>
 </g>

 <!-- Pill 4: Open Source -->
 <g transform="translate(558, 0)">
 <rect width="170" height="36" rx="8" fill="url(#pillGrad)" stroke="#ff5533" stroke-width="1.2" stroke-opacity="0.8" filter="url(#shadow3D)" />
 <rect width="4" height="36" rx="2" fill="#00ff88" />
 <text x="14" y="14" fill="#8b949e" font-size="8.5" font-weight="600" class="mono-font">OPEN SOURCE</text>
 <text x="14" y="28" fill="#00ff88" font-size="11.5" font-weight="700" class="sans-font">40 Repositories</text>
 </g>
 </g>
</svg>
