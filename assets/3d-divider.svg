<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 40" width="100%" height="40">
  <defs>
    <linearGradient id="divLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5533" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff5533" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffa07a" stop-opacity="1" />
      <stop offset="75%" stop-color="#ff5533" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ff5533" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background glowing line -->
  <line x1="40" y1="20" x2="810" y2="20" stroke="url(#divLineGrad)" stroke-width="1.5" />
  
  <!-- Center 3D Isometric Diamond Cluster -->
  <g transform="translate(425, 20)">
    <!-- Outer diamond -->
    <polygon points="0,-14 14,0 0,14 -14,0" fill="#080c14" stroke="#ff5533" stroke-width="1.5" filter="url(#divGlow)" />
    <!-- Inner diamond -->
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#ff5533" />
    <!-- Core flare -->
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    <!-- Flanking mini 3D cubes -->
    <polygon points="-35,-5 -27,0 -35,5 -43,0" fill="#ff8a65" opacity="0.8" />
    <polygon points="35,-5 43,0 35,5 27,0" fill="#ff8a65" opacity="0.8" />
    <polygon points="-70,-3 -64,0 -70,3 -76,0" fill="#ffaa33" opacity="0.6" />
    <polygon points="70,-3 76,0 70,3 64,0" fill="#ffaa33" opacity="0.6" />
  </g>
</svg>
